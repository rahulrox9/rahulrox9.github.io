
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahul's Bookshelf</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1208;--parchment:#faf6ef;--warm:#c8873a;--muted:#8a7560;--card:#fff9f2;--border:#e8dfd0;--green:#2d6b5e;--purple:#72549a;--blue:#365f9d}
body{font-family:'DM Sans',sans-serif;background:var(--parchment);color:var(--ink);min-height:100vh;padding-bottom:3rem}
nav{position:sticky;top:0;z-index:50;background:rgba(250,246,239,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2.5rem;display:flex;align-items:center;justify-content:space-between;height:52px}
.nav-logo{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;text-decoration:none;color:var(--ink)}
.nav-logo span{color:var(--warm);font-style:italic}
.nav-links{display:flex;gap:1.35rem;align-items:center}
.nav-links a{font-size:.76rem;color:var(--muted);text-decoration:none}
.nav-links a.active{color:var(--ink);font-weight:500}
.hero{max-width:1180px;margin:0 auto;padding:3rem 1.5rem 1.5rem;text-align:center}
.eyebrow{font-size:.67rem;text-transform:uppercase;letter-spacing:.16em;color:var(--warm);margin-bottom:.55rem}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,6vw,3.7rem);line-height:1}
.hero h1 span{color:var(--warm);font-style:italic}
.hero p{color:var(--muted);font-size:.84rem;margin-top:.8rem}
.hero-stats{display:flex;justify-content:center;gap:1.2rem;margin-top:1.1rem;flex-wrap:wrap}
.hero-stat{font-size:.7rem;color:var(--muted)}
.hero-stat strong{font-family:'Playfair Display',serif;color:var(--ink);font-size:1rem;margin-right:.2rem}
main{max-width:1180px;margin:0 auto;padding:0 1.5rem}
.toolbar{display:flex;gap:.55rem;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:.8rem}
.search-wrap{position:relative;flex:1;max-width:360px;min-width:200px}
.search-wrap span{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-wrap input,.control{border:1px solid var(--border);background:var(--card);border-radius:22px;padding:.55rem .8rem;font:400 .8rem 'DM Sans',sans-serif;color:var(--ink);outline:none}
.search-wrap input{width:100%;padding-left:2.25rem}
.control{cursor:pointer;color:var(--muted)}
.search-wrap input:focus,.control:focus{border-color:var(--warm)}
.results{text-align:center;color:var(--muted);font-size:.71rem;margin-bottom:1rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem}
.book-card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:grid;grid-template-columns:120px minmax(0,1fr);min-height:190px;transition:transform .18s,box-shadow .18s;animation:fadeUp .35s ease both}
.book-card:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(26,18,8,.09)}
.cover-action{display:flex;align-items:flex-start;justify-content:center;width:120px;height:100%;min-height:190px;background:#efe7db;border:0;padding:0;cursor:pointer}
.cover{display:block;width:120px;height:180px;aspect-ratio:2/3;object-fit:contain;background:#efe7db}
.cover-ph{display:flex;align-items:center;justify-content:center;width:120px;height:180px;aspect-ratio:2/3;background:linear-gradient(135deg,var(--border),#d5c8b5);font-size:2rem}
.book-content{display:flex;flex-direction:column;min-width:0;padding:.9rem 1rem}
.title-button{display:block;text-align:left;border:0;background:transparent;color:var(--ink);cursor:pointer;font:700 1.05rem/1.27 'Playfair Display',serif;padding:0;overflow-wrap:anywhere}
.title-button:hover{text-decoration:underline;text-decoration-color:var(--warm);text-underline-offset:3px}
.author{font-size:.76rem;color:var(--muted);margin-top:.3rem;line-height:1.4}
.chips{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.6rem}
.genre{display:inline-block;border-radius:9px;background:#fdebd6;color:#8d541c;font-size:.61rem;line-height:1.4;padding:.13rem .45rem}
.tag{background:#ece7f4;color:var(--purple)}
.card-bottom{margin-top:auto;padding-top:.7rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;font-size:.75rem}
.rating-number{font:700 1.3rem 'Playfair Display',serif;color:var(--warm);font-variant-numeric:tabular-nums}
.read-date{font-size:.7rem;color:var(--muted);line-height:1.4}
.reviewed-link{border:1px solid #c5dbce;border-radius:18px;padding:.26rem .6rem;background:#e8f3ed;color:var(--green);font:600 .69rem 'DM Sans',sans-serif;cursor:pointer}
.reviewed-link:hover,.reviewed-link:focus-visible{background:#d3e9db;outline-color:var(--green)}
.book-card button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.empty,.loading{text-align:center;padding:4rem;color:var(--muted);font-family:'Playfair Display',serif;font-style:italic;grid-column:1/-1}

.overlay{display:none;position:fixed;inset:0;background:rgba(26,18,8,.62);z-index:100;align-items:center;justify-content:center;padding:1rem}
.overlay.on{display:flex}
.modal{background:var(--card);width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:10px;position:relative}
.close{position:absolute;right:.8rem;top:.7rem;border:none;background:rgba(255,255,255,.9);border-radius:99px;width:31px;height:31px;cursor:pointer;font-size:1rem;z-index:2}
.modal-top{display:grid;grid-template-columns:155px minmax(0,1fr);gap:1.2rem;padding:1.25rem}
.modal-cover{width:155px;height:232px;object-fit:contain;border-radius:5px;background:var(--border)}
.modal-cover-ph{width:155px;height:232px;display:flex;align-items:center;justify-content:center;background:var(--border);font-size:2rem}
.modal h2{font-family:'Playfair Display',serif;font-size:1.5rem;line-height:1.2;margin-top:.25rem}
.modal-author{color:var(--muted);font-size:.82rem;margin-top:.3rem}
.modal-rating{font-family:'Playfair Display',serif;color:var(--warm);font-size:1.6rem;font-weight:700;margin-top:.7rem}
.modal-rating small{font:300 .7rem 'DM Sans',sans-serif;color:var(--muted)}
.modal-meta{font-size:.74rem;color:var(--muted);margin-top:.52rem;line-height:1.6}
.modal-body{padding:0 1.25rem 1.3rem}
.section{margin-top:1rem}
.section-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.3rem}
.modal-review{white-space:pre-line;font-family:'Playfair Display',serif;font-style:italic;line-height:1.65;font-size:.92rem;color:#4e4336}
.description{font-size:.8rem;line-height:1.6;color:#514638}
footer{text-align:center;margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--border);font-size:.72rem;color:var(--muted)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:680px){
nav{padding:0 1rem}
.nav-links a:not(.active){display:none}
.hero{padding:2.2rem 1rem 1.3rem}
main{padding:0 .85rem}
.grid{grid-template-columns:1fr}
.book-card{grid-template-columns:96px minmax(0,1fr);min-height:144px}
.cover-action{width:96px;min-height:144px}
.cover,.cover-ph{width:96px;height:144px}
.book-content{padding:.75rem}
.modal-top{grid-template-columns:95px minmax(0,1fr);gap:.85rem}
.modal-cover,.modal-cover-ph{width:95px;height:143px}
.modal h2{font-size:1.18rem}
.toolbar{align-items:stretch}
.control{flex:1}
.search-wrap{max-width:none}
}
</style>
</head>

  <div class="nav-links">
    <a href="watchlist.html">Watchlist</a>
    <a href="travel.html">Travels</a>
    <a class="active" href="books.html">Bookshelf</a>
    <a href="magnets.html">Magnets</a>

<header class="hero">
  <div class="eyebrow">Personal archive</div>
  <h1>Rahul's <span>Bookshelf</span></h1>
  <p>My personal library, ratings and reviews.</p>
  <div class="hero-stats">
    <span class="hero-stat"><strong id="count">0</strong>books</span>
    <span class="hero-stat"><strong id="average">—</strong>average rating</span>
    <span class="hero-stat"><strong id="updated">—</strong>last updated</span>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="search-wrap">
      <span>⌕</span>
      <input id="search" type="search" placeholder="Search title, author, genre, subject or tag…" oninput="render()">
    </div>
    <select class="control" id="genre-filter" onchange="setGenre(this.value)">
      <option value="All">All genres</option>
    </select>
    <select class="control" id="shelf-filter" onchange="render()">
      <option value="">All shelves</option>
    </select>
    <select class="control" id="rating-filter" onchange="render()">
      <option value="">All ratings</option>
      <option value="8">8+</option>
      <option value="6">6+</option>
      <option value="unrated">Unrated</option>
    </select>
    <select class="control" id="year-filter" onchange="render()">
      <option value="">All read years</option>
    </select>
    <select class="control" id="sort" onchange="render()">
      <option value="read-desc">Recently read</option>
      <option value="read-asc">Oldest read</option>
      <option value="rating-desc">Highest rated</option>
      <option value="rating-asc">Lowest rated</option>
      <option value="title-asc">Title A–Z</option>
      <option value="author-asc">Author A–Z</option>
    </select>
  </div>
  <div class="results" id="results"></div>
  <div class="grid" id="grid">
    <div class="loading">Opening the shelves…</div>
  </div>
</main>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <article class="modal" role="dialog" aria-modal="true" aria-label="Book details and review" tabindex="-1" onclick="event.stopPropagation()">
    <button class="close" onclick="closeModal()" aria-label="Close">×</button>
    <div id="modal-content"></div>
  </article>
</div>

<footer>Ratings are shown out of 10.</footer>

<script>
const DB_URL = 'https://script.google.com/macros/s/AKfycbyrGy4Stw2IKEcK9a7WfzrOVrEs6s5mF-m2vKE6l-_Jt3Am5X248llZ4z9rpX5piJwuZQ/exec';
const BOOKS_FILE = 'books.json';

let database = {books:[],updatedAt:0};
let activeGenre = 'All';

const DEFAULT_SHELVES = [
  {value:'towatch',label:'To Read'},
  {value:'reading',label:'Currently Reading'},
  {value:'read',label:'Read'}
];

function shelfLabel(value) {
  return DEFAULT_SHELVES.find(s=>s.value===value)?.label||value;
}

function jsonp(url,file) {
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    let settled=false;
    const cleanup=()=>{
      clearTimeout(timer);
      delete window[cb];
      s.remove();
    };
    const fail=error=>{
      if(settled)return;
      settled=true;
      cleanup();
      reject(error);
    };
    const timer=setTimeout(()=>fail(new Error('Drive read timed out')),15000);
    window[cb]=data=>{
      if(settled)return;
      settled=true;
      cleanup();
      if(data&&data.ok===false)reject(new Error(data.error||'Drive read failed'));
      else resolve(data);
    };
    s.onerror=()=>fail(new Error('Drive read failed'));
    s.src=url+'?file='+encodeURIComponent(file)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
    document.head.appendChild(s);
  });
}

function esc(v='') {
  return String(v).replace(/[&<>'"]/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    "'":'&#39;','"':'&quot;'
  }[c]));
}

function jsArg(v) {
  return esc(JSON.stringify(String(v)));
}

function normalise(value) {
  const db=Array.isArray(value)
    ?{books:value,updatedAt:0}
    :value&&Array.isArray(value.books)
      ?value
      :{books:[],updatedAt:0};

  db.books=db.books.map(b=>{
    const shelf=b.shelf==='reading'||((b.shelf==='read'||!b.shelf)&&b.status==='reading')
      ?'reading'
      :b.shelf==='towatch'||((b.shelf==='read'||!b.shelf)&&b.status==='towatch')
        ?'towatch':'read';

    const custom=b.shelf&&!DEFAULT_SHELVES.some(s=>s.value===b.shelf)
      ?[b.shelf]:[];

    const shelves=[...new Set([
      ...(Array.isArray(b.shelves)?b.shelves:[]),
      ...custom
    ])];

    return {
      ...b,
      shelf,
      status:shelf==='read'?'finished':shelf,
      shelves,
      genres:Array.isArray(b.genres)?b.genres:(b.genre?[b.genre]:[]),
      subjects:Array.isArray(b.subjects)?b.subjects:[],
      categories:Array.isArray(b.categories)?b.categories:[],
      tags:Array.isArray(b.tags)?b.tags:[],
      readings:Array.isArray(b.readings)
        ?b.readings
        :(b.readDate?[{
          date:b.readDate,
          precision:(b.readDate||'').length===7?'month':'day'
        }]:[])
    };
  });
  return db;
}

function dateTs(v) {
  if(!v)return 0;
  const d=new Date(v.length===7?v+'-01T00:00:00':v+'T00:00:00');
  return Number.isNaN(d.getTime())?0:d.getTime();
}

function latestReading(b) {
  const known=(b.readings||[])
    .filter(r=>r.precision!=='unknown'&&dateTs(r.date))
    .sort((a,b)=>dateTs(b.date)-dateTs(a.date));
  return known[0]||(b.readings||[]).find(r=>r.precision==='unknown')||null;
}

function latestReadTs(b) {
  const r=latestReading(b);
  return r&&r.precision!=='unknown'?dateTs(r.date):0;
}

function formatReading(r) {
  if(!r||r.precision==='unknown')return'Date unknown';

  if(r.precision==='month'&&/^\d{4}-\d{2}$/.test(r.date||'')) {
    return new Date(r.date+'-01T00:00:00')
      .toLocaleDateString('en-GB',{month:'short',year:'numeric'});
  }

  if(/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')) {
    return new Date(r.date+'T00:00:00')
      .toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }

  return r.date||'Date unknown';
}

function formatUpdated(ts) {
  if(!ts)return'—';
  const d=new Date(ts);
  return Number.isNaN(d.getTime())
    ?'—'
    :d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

async function load() {
  try {
    const raw=await jsonp(DB_URL,BOOKS_FILE);
    if(!Array.isArray(raw)&&!(raw&&Array.isArray(raw.books))) {
      throw new Error('Invalid books database');
    }
    database=normalise(raw);
    updateHeader();
    buildFilters();
    render();
  } catch(e) {
    console.error(e);
    document.getElementById('grid').innerHTML=
      '<div class="empty">Could not load books from Drive.</div>';
  }
}

function updateHeader() {
  const rated=database.books.filter(b=>
    b.shelf==='read'&&b.rating10!==null&&
    b.rating10!==undefined&&b.rating10!==''
  );
  const avg=rated.length
    ?rated.reduce((s,b)=>s+Number(b.rating10||0),0)/rated.length
    :0;

  document.getElementById('count').textContent=database.books.length;
  document.getElementById('average').textContent=avg?avg.toFixed(1)+'/10':'—';
  document.getElementById('updated').textContent=formatUpdated(database.updatedAt);
}

function buildFilters() {
  const genres=[
    'All',
    ...new Set(database.books.flatMap(b=>b.genres||[]).filter(Boolean))
  ].sort((a,b)=>a==='All'?-1:b==='All'?1:a.localeCompare(b));

  document.getElementById('genre-filter').innerHTML=
    genres.map(g=>`<option value="${esc(g)}" ${g===activeGenre?'selected':''}>${g==='All'?'All genres':esc(g)}</option>`).join('');

  const sf=document.getElementById('shelf-filter');
  const selected=sf.value;
  const custom=[...new Set(
    database.books.flatMap(b=>b.shelves||[])
  )].filter(Boolean).sort((a,b)=>a.localeCompare(b));

  sf.innerHTML='<option value="">All shelves</option>'+
    DEFAULT_SHELVES.map(s=>`<option value="${s.value}">${s.label}</option>`).join('')+
    custom.map(s=>`<option value="custom:${esc(s)}">${esc(s)}</option>`).join('');

  sf.value=[...sf.options].some(o=>o.value===selected)?selected:'';

  const years=[...new Set(
    database.books.flatMap(b=>
      (b.readings||[]).map(r=>(r.date||'').slice(0,4))
    ).filter(Boolean)
  )].sort((a,b)=>b-a);

  document.getElementById('year-filter').innerHTML=
    '<option value="">All read years</option>'+
    years.map(y=>`<option>${esc(y)}</option>`).join('');
}

function setGenre(g) {
  activeGenre=g;
  render();
}

function visibleBooks() {
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const sf=document.getElementById('shelf-filter').value;
  const minRating=document.getElementById('rating-filter').value;
  const year=document.getElementById('year-filter').value;
  const sort=document.getElementById('sort').value;

  const books=database.books.filter(b=>{
    const hay=[
      b.title,b.author,b.review,b.description,
      (b.genres||[]).join(' '),
      (b.tags||[]).join(' '),
      (b.shelves||[]).join(' '),
      (b.subjects||[]).join(' '),
      (b.categories||[]).join(' '),
      b.subtitle,b.isbn13,b.isbn10,b.series
    ].join(' ').toLowerCase();

    const shelfOk=!sf||(
      sf.startsWith('custom:')
        ?(b.shelves||[]).includes(sf.slice(7))
        :b.shelf===sf
    );

    const genreOk=activeGenre==='All'||(b.genres||[]).includes(activeGenre);

    const ratingOk=!minRating||(
      minRating==='unrated'
        ?b.rating10===null||b.rating10===undefined||b.rating10===''
        :Number(b.rating10)>=Number(minRating)
    );

    const yearOk=!year||(b.readings||[])
      .some(r=>(r.date||'').startsWith(year));

    return(!q||hay.includes(q))&&shelfOk&&genreOk&&ratingOk&&yearOk;
  });

  books.sort((a,b)=>{
    if(sort==='read-desc')
      return latestReadTs(b)-latestReadTs(a)||(b.createdAt||0)-(a.createdAt||0);

    if(sort==='read-asc') {
      const at=latestReadTs(a)||Number.MAX_SAFE_INTEGER;
      const bt=latestReadTs(b)||Number.MAX_SAFE_INTEGER;
      return at-bt;
    }

    if(sort==='rating-desc')
      return Number(b.rating10??-1)-Number(a.rating10??-1);

    if(sort==='rating-asc') {
      const ar=a.rating10==null?99:Number(a.rating10);
      const br=b.rating10==null?99:Number(b.rating10);
      return ar-br;
    }

    if(sort==='title-asc')
      return(a.title||'').localeCompare(b.title||'');

    if(sort==='author-asc')
      return(a.author||'').localeCompare(b.author||'');

    return 0;
  });

  return books;
}

function coverCard(b) {
  const url=typeof b.cover==='string'&&/^https?:\/\//i.test(b.cover)
    ?b.cover:'';

  const placeholder='<span class="cover-ph" aria-hidden="true">📖</span>';

  return `<button type="button" class="cover-action"
    onclick="openModal(${jsArg(b.id)})"
    aria-label="View ${esc(b.title)} details">
    ${url?`
      <img class="cover"
        src="${esc(url)}"
        alt="Cover of ${esc(b.title)}"
        loading="lazy"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <span class="cover-ph" style="display:none" aria-hidden="true">📖</span>
    `:placeholder}
  </button>`;
}

function render() {
  const books=visibleBooks();

  document.getElementById('results').textContent=
    books.length===database.books.length
      ?`${database.books.length} books`
      :`${books.length} of ${database.books.length} books`;

  const grid=document.getElementById('grid');

  if(!books.length) {
    grid.innerHTML='<div class="empty">No books match your filters.</div>';
    return;
  }

  grid.innerHTML=books.map((b,i)=>{
    const r=latestReading(b);

    const rating=b.rating10!==null&&b.rating10!==undefined&&
      b.rating10!==''&&Number.isFinite(Number(b.rating10))
        ?Number(b.rating10):null;

    const ratingText=rating===null
      ?''
      :`<span class="rating-number" aria-label="Rating ${rating} out of 10">
          ${rating.toFixed(Number.isInteger(rating)?0:1)}
        </span>`;

    const genreLabels=(b.genres||[]).filter(Boolean);

    const genreText=genreLabels.slice(0,3)
      .map(g=>`<span class="genre">${esc(g)}</span>`).join('')+
      (genreLabels.length>3
        ?`<span class="genre" title="${esc(genreLabels.slice(3).join(', '))}">
            +${genreLabels.length-3}
          </span>`:'');
    
    const dateText=b.shelf==='read'
      ?(r?`Read ${esc(formatReading(r))}`:'Read date not recorded')
      :b.shelf==='reading'
        ?(Number(b.pages)>0
          ?`Currently reading · page ${Number(b.currentPage)||0} of ${Number(b.pages)}`
          :'Currently reading')
        :'To Read';

    const hasReview=typeof b.review==='string'&&b.review.trim();

    return `<article class="book-card" style="animation-delay:${Math.min(i*.02,.35)}s">
      ${coverCard(b)}

      <div class="book-content">
        <button type="button" class="title-button"
          onclick="openModal(${jsArg(b.id)})">
          ${esc(b.title||'Untitled')}
        </button>

        <div class="author">${esc(b.author||'Unknown author')}</div>

        <div class="chips">${genreText}</div>

        <div class="card-bottom">
          ${ratingText}
          <span class="read-date">${dateText}</span>

          ${hasReview?`
            <button type="button" class="reviewed-link"
              onclick="openModal(${jsArg(b.id)},true)"
              aria-label="Read review of ${esc(b.title)}">
              ✓ Reviewed
            </button>
          `:''}
        </div>
      </div>
    </article>`;
  }).join('');
}

function openModal(id,goToReview=false) {
  const b=database.books.find(x=>String(x.id)===String(id));
  if(!b)return;

  const rating=b.rating10!==null&&b.rating10!==undefined&&
    b.rating10!==''&&Number.isFinite(Number(b.rating10))
      ?Number(b.rating10):null;

  const metadata=[
    b.publisher||'',b.publishDate||'',
    b.pages?`${b.pages} pages`:'',
    b.language||'',
    b.isbn13?'ISBN-13: '+b.isbn13:'',
    b.isbn10?'ISBN-10: '+b.isbn10:'',
    b.originalPublicationYear?'First published: '+b.originalPublicationYear:''
  ].filter(Boolean);

  const section=(label,value)=>value
    ?`<div class="section">
        <div class="section-label">${esc(label)}</div>
        <div class="description">${esc(value)}</div>
      </div>`
    :'';

  const related=[
    ['Places',(b.subjectPlaces||[]).join(', ')],
    ['People',(b.subjectPeople||[]).join(', ')],
    ['Periods',(b.subjectTimes||[]).join(', ')],
    ['Edition',b.editionName||''],
    ['Format',b.physicalFormat||'']
  ].filter(([,v])=>v);

  const urls=[
    ['Open Library',b.openLibraryUrl],
    ['Google Books',b.googleBooksUrl],
    ['Preview',b.previewLink]
  ].filter(([,u])=>typeof u==='string'&&/^https:\/\//i.test(u));

  const readDates=(b.readings||[])
    .filter(r=>r.date&&r.precision!=='unknown')
    .map(r=>formatReading(r));

  const recentProgress=(b.progressHistory||[])
    .slice()
    .sort((a,z)=>String(z.date).localeCompare(String(a.date)))
    .slice(0,12);

  const coverUrl=typeof b.cover==='string'&&/^https?:\/\//i.test(b.cover)
    ?b.cover:'';

  document.getElementById('modal-content').innerHTML=`
    <div class="modal-top">
      ${coverUrl
        ?`<img class="modal-cover" src="${esc(coverUrl)}"
            alt="Cover of ${esc(b.title)}" onerror="this.style.display='none'">`
        :'<div class="modal-cover-ph">📖</div>'}

      <div>
        <div class="chips">
          <span class="genre">${esc(shelfLabel(b.shelf))}</span>
          ${(b.shelves||[])
            .map(s=>`<span class="genre tag">${esc(s)}</span>`).join('')}
          ${(b.genres||[])
            .map(g=>`<span class="genre">${esc(g)}</span>`).join('')}
        </div>

        <h2>${esc(b.title)}</h2>

        ${b.subtitle
          ?`<div class="modal-author">${esc(b.subtitle)}</div>`:''}

        <div class="modal-author">${esc(b.author||'Unknown author')}</div>

        ${rating!==null
          ?`<div class="modal-rating">
              ${rating.toFixed(Number.isInteger(rating)?0:1)}
              <small>/10</small>
            </div>`:''}

        <div class="modal-meta">${metadata.map(esc).join(' · ')}</div>

        ${readDates.length
          ?`<div class="modal-meta">
              Read: ${esc(readDates.join(' · '))}
            </div>`:''}

        ${b.shelf==='reading'
          ?`<div class="modal-meta">
              Currently reading: page ${Number(b.currentPage)||0}
              ${Number(b.pages)?' of '+Number(b.pages):''}
            </div>`:''}
      </div>
    </div>

    <div class="modal-body">
      ${b.review&&String(b.review).trim()
        ?`<div class="section" id="review-section">
            <div class="section-label">My review</div>
            <div class="modal-review">${esc(b.review)}</div>
          </div>`:''}

      ${section('Description',b.description)}

      ${recentProgress.length
        ?`<div class="section">
            <div class="section-label">Reading progress</div>
            <div class="description">
              ${recentProgress.map(p=>
                `${esc(p.date)}: page ${Number(p.page)||0}`+
                (p.note?' · '+esc(p.note):'')
              ).join('<br>')}
            </div>
          </div>`:''}

      ${section('Subjects',(b.subjects||[]).join(' · '))}
      ${section('Source categories',(b.categories||[]).join(' · '))}
      ${related.map(([k,v])=>section(k,v)).join('')}

      ${(b.tags||[]).length
        ?section('Personal tags',b.tags.join(', ')):''}

      ${urls.length
        ?`<div class="section">
            <div class="section-label">Sources</div>
            <div class="description">
              ${urls.map(([label,link])=>
                `<a href="${esc(link)}" target="_blank"
                   rel="noopener noreferrer">${esc(label)}</a>`
              ).join(' · ')}
            </div>
          </div>`:''}
    </div>`;

  const overlay=document.getElementById('overlay');
  overlay.classList.add('on');

  const modal=overlay.querySelector('.modal');
  modal.scrollTop=0;
  modal.focus();

  if(goToReview&&b.review) {
    requestAnimationFrame(()=>{
      document.getElementById('review-section')
        ?.scrollIntoView({block:'nearest'});
    });
  }
}

function closeModal(e) {
  if(e&&e.target!==document.getElementById('overlay'))return;
  document.getElementById('overlay').classList.remove('on');
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('overlay').classList.contains('on')) {
    closeModal();
  }
});

load();
</script>
</body>
</html>
