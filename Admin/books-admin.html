
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookshelf Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1208;--parchment:#faf6ef;--warm:#c8873a;--muted:#8a7560;--card:#fff9f2;--border:#e8dfd0;--green:#2d6b5e;--red:#b64335;--blue:#365f9d;--purple:#72549a}
body{font-family:'DM Sans',sans-serif;background:var(--parchment);color:var(--ink);min-height:100vh;padding-bottom:5rem}
button,input,select,textarea{font:inherit}
nav{position:sticky;top:0;z-index:100;background:#1a1208;color:#fff;height:50px;padding:0 1.25rem;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:'Playfair Display',serif;font-weight:700;color:#fff;text-decoration:none}.nav-logo span{color:var(--warm);font-style:italic}.nav-right{display:flex;gap:.6rem;align-items:center}.nav-link{color:rgba(255,255,255,.72);text-decoration:none;font-size:.72rem;border:1px solid rgba(255,255,255,.18);padding:.27rem .62rem;border-radius:4px}
main{max-width:1120px;margin:0 auto;padding:1.35rem}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1rem}.hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.7rem,4vw,2.45rem)}.hero h1 span{color:var(--warm);font-style:italic}.hero p{font-size:.77rem;color:var(--muted);margin-top:.25rem}
.panel{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-bottom:1rem}.actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}.btn{border:none;border-radius:5px;padding:.55rem .86rem;background:var(--warm);color:#fff;font-size:.78rem;font-weight:500;cursor:pointer}.btn:hover{opacity:.88}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.red{background:var(--red)}.btn.sm{padding:.32rem .58rem;font-size:.69rem}
.status{font-size:.74rem;color:var(--muted);margin-top:.65rem;min-height:1.1rem}.status.ok{color:var(--green)}.status.err{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.65rem;margin-bottom:1rem}.stat{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:.75rem}.stat strong{display:block;font-family:'Playfair Display',serif;font-size:1.25rem}.stat span{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1rem;gap:.2rem}.tab{background:none;border:none;border-bottom:2px solid transparent;padding:.5rem .9rem;color:var(--muted);cursor:pointer;font-size:.76rem}.tab.on{color:var(--warm);border-bottom-color:var(--warm);font-weight:600}.section{display:none}.section.on{display:block}
.controls{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center}.control{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:20px;padding:.5rem .75rem;font-size:.78rem;outline:none}.control:focus{border-color:var(--warm)}.search{flex:1;min-width:220px}
.book-list{display:flex;flex-direction:column;gap:.6rem}.book-row{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:.72rem;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:.75rem;align-items:center}.cover{width:52px;height:78px;object-fit:cover;border-radius:3px;background:var(--border)}.cover-ph{width:52px;height:78px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:var(--border);font-size:1.25rem}.book-title{font-family:'Playfair Display',serif;font-size:.93rem;font-weight:700}.book-meta{font-size:.7rem;color:var(--muted);margin-top:.15rem;line-height:1.45}.chips{display:flex;gap:.28rem;flex-wrap:wrap;margin-top:.35rem}.chip{font-size:.58rem;border-radius:10px;padding:.1rem .4rem;background:#f6e8d7;color:var(--warm)}.chip.tag{background:#ece7f4;color:var(--purple)}.chip.towatch{background:#e2eefc;color:var(--blue)}.row-actions{display:flex;gap:.35rem;align-items:center}.icon-btn{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:4px;padding:.35rem .48rem;cursor:pointer;font-size:.7rem}.icon-btn:hover{border-color:var(--warm);color:var(--warm)}
.pagination{display:flex;justify-content:center;gap:.5rem;align-items:center;margin-top:1rem;font-size:.72rem;color:var(--muted)}
.field{margin-bottom:.75rem}.field label{display:block;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.25rem}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:5px;background:var(--parchment);padding:.5rem .62rem;color:var(--ink);font-size:.8rem;outline:none}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--warm)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.wide{grid-column:1/-1}
.overlay{display:none;position:fixed;inset:0;background:rgba(26,18,8,.62);z-index:500;align-items:center;justify-content:center;padding:1rem}.overlay.on{display:flex}.modal{background:var(--card);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:9px;position:relative;padding:1.1rem}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem}.modal h2{font-family:'Playfair Display',serif;font-size:1.25rem}.close{border:none;background:none;font-size:1.3rem;color:var(--muted);cursor:pointer}
.genre-options{display:flex;flex-wrap:wrap;gap:.35rem;max-height:150px;overflow:auto;border:1px solid var(--border);background:var(--parchment);padding:.5rem;border-radius:5px}.genre-option{display:flex;align-items:center;gap:.3rem;font-size:.7rem;border:1px solid var(--border);background:var(--card);padding:.24rem .45rem;border-radius:12px;text-transform:none;letter-spacing:0;color:var(--ink)}.genre-option input{width:auto;accent-color:var(--warm)}
.reading-row{display:grid;grid-template-columns:120px 1fr auto;gap:.45rem;margin-bottom:.4rem;align-items:center}.reading-row select,.reading-row input{border:1px solid var(--border);border-radius:4px;background:var(--parchment);padding:.42rem;font-size:.75rem}.empty{text-align:center;padding:2.5rem;color:var(--muted);font-family:'Playfair Display',serif;font-style:italic}.note{font-size:.7rem;color:var(--muted);line-height:1.5}
#reader-container{max-width:400px;margin:1rem auto;display:none}
.search-modal-results{display:flex;flex-direction:column;gap:.5rem;max-height:300px;overflow-y:auto;margin-top:.5rem}
.search-result-item{display:flex;align-items:center;gap:.6rem;padding:.4rem;border:1px solid var(--border);border-radius:5px;background:var(--parchment);cursor:pointer}
.search-result-item:hover{background:var(--card);border-color:var(--warm)}
.search-result-item img{width:36px;height:54px;object-fit:cover;border-radius:2px}
@media(max-width:760px){main{padding:.85rem}.hero{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.book-row{grid-template-columns:48px minmax(0,1fr)}.cover,.cover-ph{width:48px;height:72px}.row-actions{grid-column:2}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.reading-row{grid-template-columns:105px 1fr auto}.actions .btn{flex:1;min-width:135px}}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="admin.html">Admin <span>Bookshelf</span></a>
  <div class="nav-right"><a class="nav-link" href="../Public/books.html">Public bookshelf</a><a class="nav-link" href="admin.html">Admin home</a></div>
</nav>
<main>
  <div class="hero"><div><h1>Bookshelf <span>Database</span></h1><p>Manage your library, page progress, series search &amp; barcode scanner.</p></div><div id="save-state" class="status">Loading…</div></div>

  <section class="panel">
    <div style="display:flex;gap:0.5rem;margin-bottom:0.8rem;flex-wrap:wrap">
      <input id="quick-query" class="control" style="flex:1;min-width:240px;border-radius:5px;background:var(--parchment)" placeholder="Type book title or paste Goodreads link…" onkeydown="if(event.key==='Enter')quickOnlineSearch()">
      <button class="btn blue" onclick="quickOnlineSearch()">🔍 Fetch Book</button>
      <button class="btn green" onclick="createManualBook()">＋ Manual Add</button>
      <button class="btn blue" onclick="toggleScanner()">📷 Scan Barcode</button>
    </div>
    <div id="quick-results" style="margin-bottom:0.5rem"></div>
    <div id="reader-container"><div id="reader"></div><button class="btn sm red" style="margin-top:0.5rem;width:100%" onclick="stopScanner()">Close Camera</button></div>
    <div id="status" class="status">Loading books.json…</div>
  </section>

  <div class="stats">
    <div class="stat"><strong id="stat-total">0</strong><span>Books</span></div>
    <div class="stat"><strong id="stat-rated">0</strong><span>Rated (/10)</span></div>
    <div class="stat"><strong id="stat-towatch">0</strong><span>To Read</span></div>
    <div class="stat"><strong id="stat-reread">0</strong><span>Reread</span></div>
    <div class="stat"><strong id="stat-average">—</strong><span>Average /10</span></div>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="switchSection('books',this)">Books</button>
    <button class="tab" onclick="switchSection('rules',this)">Custom Folders &amp; Genres</button>
  </div>

  <section id="section-books" class="section on">
    <div class="panel controls">
      <input id="search" class="control search" placeholder="Search title, author or genre…" oninput="bookPage=1;renderBooks()">
      <select id="shelf-filter" class="control" onchange="bookPage=1;renderBooks()">
        <option value="">All shelves</option>
        <option value="read">Read</option>
        <option value="towatch">To Read</option>
      </select>
      <select id="genre-filter" class="control" onchange="bookPage=1;renderBooks()"><option value="">All genres</option></select>
      <select id="sort" class="control" onchange="bookPage=1;renderBooks()">
        <option value="read-desc">Recently read</option><option value="rating-desc">Highest rated</option><option value="title-asc">Title A–Z</option><option value="author-asc">Author A–Z</option><option value="added-desc">Recently added</option>
      </select>
    </div>
    <div id="book-list" class="book-list"><div class="empty">Loading…</div></div>
    <div id="pagination" class="pagination"></div>
  </section>

  <section id="section-rules" class="section">
    <div class="panel" style="max-width:500px">
      <h3 style="font-family:'Playfair Display',serif;margin-bottom:.75rem">Controlled genres &amp; custom folders</h3>
      <div id="genre-cloud" class="genre-cloud" style="margin-bottom:1rem"></div>
      <div class="field"><label>Add custom genre / folder</label><div class="actions"><input id="new-genre" class="control" style="border-radius:5px;flex:1" placeholder="e.g. Classics, Sci-Fi Favorites"><button class="btn sm" onclick="addCustomGenre()">Add</button></div></div>
    </div>
  </section>
</main>

<div class="overlay" id="editor-overlay" onclick="closeEditor(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head"><div><h2 id="editor-heading">Edit book</h2><div class="note">Changes save automatically.</div></div><button class="close" onclick="closeEditor()">×</button></div>
    <div id="editor-form"></div>
  </div>
</div>

<script>
const DB_URL='https://script.google.com/macros/s/AKfycbzpa1fUDZDXfQT5L6SxQRNf1zEFk-tpHV_2Tq9CY2iG4iSqa4W__Rnqs6fshnGJ0pnvRQ/exec';
const BOOKS_FILE='books.json';
const RULES_FILE='book_genre_rules.json';
const PAGE_SIZE=100;
const BASE_GENRES=['Fiction','Nonfiction','Literary Fiction','Historical Fiction','Science Fiction','Fantasy','Mystery','Thriller','Crime','Horror','Romance','Adventure','Short Stories','Poetry','Graphic Novel','Biography','Memoir','History','Politics','Philosophy','Science','Technology','Business','Economics','Psychology','Essays','Travel','Religion','Self-help','Humour','Young Adult','Children'];

let database={version:2,updatedAt:0,books:[]};
let rules={version:1,customGenres:[]};
let bookPage=1;
let editingBookId=null;
let saveTimer=null;
let saveInFlight=false;
let saveAgain=false;
let html5QrCode=null;

function jsonp(url,file){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');window[cb]=data=>{delete window[cb];s.remove();resolve(data)};s.onerror=()=>{delete window[cb];s.remove();reject(new Error('Drive read failed'))};s.src=url+'?file='+encodeURIComponent(file)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(s)})}
async function driveRead(file){return await jsonp(DB_URL,file)}
async function driveWrite(file,data){const r=await fetch(DB_URL,{method:'POST',body:JSON.stringify({file,data})});const text=await r.text();if(!r.ok||text.trim()!=='ok')throw new Error(text||`HTTP ${r.status}`);return true}
async function serverAction(action,params={}){const r=await fetch(DB_URL,{method:'POST',body:JSON.stringify({action,...params})});const data=await r.json();if(!data.ok)throw new Error(data.error||'Server action failed');return data}

function setStatus(text,type=''){const el=document.getElementById('status');el.textContent=text;el.className='status '+type}
function setSaveState(text,type=''){const el=document.getElementById('save-state');el.textContent=text;el.className='status '+type}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function uid(prefix='id'){return prefix+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)}
function todayIso(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateTs(v){if(!v)return 0;const d=new Date(v.length===7?v+'-01T00:00:00':v+'T00:00:00');return Number.isNaN(d.getTime())?0:d.getTime()}
function formatReading(r){if(!r||r.precision==='unknown')return 'Date unknown';if(r.precision==='month'&&/^\d{4}-\d{2}$/.test(r.date||'')){return new Date(r.date+'-01T00:00:00').toLocaleDateString('en-GB',{month:'short',year:'numeric'})}if(/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')){return new Date(r.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}return r.date||'Date unknown'}
function latestReading(book){const readings=(book.readings||[]);const known=readings.filter(r=>r.precision!=='unknown'&&dateTs(r.date)).sort((a,b)=>dateTs(b.date)-dateTs(a.date));return known[0]||readings.find(r=>r.precision==='unknown')||null}
function latestReadTs(book){const r=latestReading(book);return r&&r.precision!=='unknown'?dateTs(r.date):0}
function allGenres(){return [...new Set([...BASE_GENRES,...(rules.customGenres||[])])].sort((a,b)=>a.localeCompare(b))}

function normaliseDatabase(value){const db=Array.isArray(value)?{version:2,updatedAt:0,books:value}:value&&Array.isArray(value.books)?value:{version:2,updatedAt:0,books:[]};db.version=2;db.books=db.books.map(normaliseBook);return db}
function normaliseBook(b){let readings=Array.isArray(b.readings)?b.readings:[];if(!readings.length&&b.readDate)readings=[{id:uid('reading'),date:b.readDate,precision:/^\d{4}-\d{2}-\d{2}$/.test(b.readDate)?'day':'month'}];const genres=Array.isArray(b.genres)?b.genres:(b.genre?[b.genre]:[]);return {...b,id:b.id||uid('book'),additionalAuthors:Array.isArray(b.additionalAuthors)?b.additionalAuthors:[],rating10:b.rating10===0?0:(b.rating10??null),review:b.review||'',description:b.description||'',shelf:b.shelf||'read',status:b.status||(b.shelf==='towatch'?'towatch':'finished'),series:b.series||'',seriesNumber:b.seriesNumber||'',currentPage:Number(b.currentPage)||0,pages:Number(b.pages)||0,readings,genres,tags:Array.isArray(b.tags)?b.tags:[],createdAt:b.createdAt||b.addedAt||Date.now(),updatedAt:b.updatedAt||Date.now()}}

async function loadAll(){try{const [db,r]=await Promise.all([driveRead(BOOKS_FILE).catch(()=>null),driveRead(RULES_FILE).catch(()=>null)]);database=normaliseDatabase(db);rules=r&&typeof r==='object'&&!Array.isArray(r)?{version:1,customGenres:Array.isArray(r.customGenres)?r.customGenres:[]}:{version:1,customGenres:[]};refreshAll();setStatus(`Loaded ${database.books.length} personal books from Drive.`,'ok');setSaveState('Saved','ok')}catch(e){console.error(e);setStatus('Could not load books: '+e.message,'err');setSaveState('Load failed','err')}}
function refreshAll(){renderStats();buildGenreControls();renderBooks();renderRules()}
function renderStats(){const rated=database.books.filter(b=>Number.isFinite(Number(b.rating10))&&b.rating10!==null&&b.rating10!=='');const avg=rated.length?rated.reduce((s,b)=>s+Number(b.rating10),0)/rated.length:0;document.getElementById('stat-total').textContent=database.books.length;document.getElementById('stat-rated').textContent=rated.length;document.getElementById('stat-towatch').textContent=database.books.filter(b=>b.shelf==='towatch').length;document.getElementById('stat-reread').textContent=database.books.filter(b=>(b.readings||[]).length>1).length;document.getElementById('stat-average').textContent=avg?avg.toFixed(1):'—'}
function switchSection(name,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));btn.classList.add('on');document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));document.getElementById('section-'+name).classList.add('on');if(name==='rules')renderRules()}
function buildGenreControls(){const genres=allGenres();const f=document.getElementById('genre-filter');const current=f.value;f.innerHTML='<option value="">All genres</option>'+genres.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');f.value=current;document.getElementById('genre-cloud').innerHTML=genres.map(g=>`<span class="chip">${esc(g)}</span>`).join('')}
function filteredBooks(){const q=(document.getElementById('search').value||'').toLowerCase().trim();const sf=document.getElementById('shelf-filter').value;const gf=document.getElementById('genre-filter').value;const sort=document.getElementById('sort').value;const arr=database.books.filter(b=>{const hay=[b.title,b.author,b.series,(b.genres||[]).join(' '),(b.tags||[]).join(' ')].join(' ').toLowerCase();const shelfOk=!sf||(b.shelf||'read')===sf;const gOk=!gf||(b.genres||[]).includes(gf);return(!q||hay.includes(q))&&shelfOk&&gOk});arr.sort((a,b)=>{if(sort==='read-desc')return latestReadTs(b)-latestReadTs(a)||(b.createdAt||0)-(a.createdAt||0);if(sort==='rating-desc')return(Number(b.rating10)||-1)-(Number(a.rating10)||-1);if(sort==='title-asc')return(a.title||'').localeCompare(b.title||'');if(sort==='author-asc')return(a.author||'').localeCompare(b.author||'');if(sort==='added-desc')return(b.createdAt||0)-(a.createdAt||0);return 0});return arr}
function renderBooks(){renderStats();const arr=filteredBooks();const pages=Math.max(1,Math.ceil(arr.length/PAGE_SIZE));bookPage=Math.min(bookPage,pages);const visible=arr.slice((bookPage-1)*PAGE_SIZE,bookPage*PAGE_SIZE);const list=document.getElementById('book-list');if(!visible.length){list.innerHTML='<div class="empty">No books match your filters.</div>'}else{list.innerHTML=visible.map(b=>{const r=latestReading(b);const rating=b.rating10!==null&&b.rating10!==''&&b.rating10!==undefined?`${Number(b.rating10).toFixed(Number(b.rating10)%1?1:0)}/10`:'Unrated';const seriesInfo=b.series?` · Series: ${b.series}${b.seriesNumber?' #'+b.seriesNumber:''}`:'';const totalPages=Number(b.pages)||0;const currPage=Number(b.currentPage)||0;const pct=totalPages>0?Math.min(100,Math.round((currPage/totalPages)*100)):0;return`<div class="book-row">${b.cover?`<img class="cover" src="${esc(b.cover)}" alt="${esc(b.title)}" loading="lazy">`:'<div class="cover-ph">📖</div>'}<div><div class="book-title">${esc(b.title)}</div><div class="book-meta">${esc(b.author||'Unknown author')}${seriesInfo} · Rating: ${rating}${r?' · Read: '+esc(formatReading(r)):''}</div><div class="chips">${b.shelf==='towatch'?'<span class="chip towatch">To Read</span>':''}${(b.genres||[]).map(g=>`<span class="chip">${esc(g)}</span>`).join('')}${(b.tags||[]).slice(0,3).map(t=>`<span class="chip tag">${esc(t)}</span>`).join('')}</div>${totalPages>0?`<div style="margin-top:0.35rem;font-size:0.68rem;color:var(--muted)">Page ${currPage} of ${totalPages} (${pct}%)<div style="background:var(--border);border-radius:99px;height:4px;overflow:hidden;margin-top:0.15rem"><div style="background:var(--warm);height:100%;width:${pct}%"></div></div></div>`:''}</div><div class="row-actions"><button class="icon-btn" onclick="openEditor('${esc(b.id)}')">Edit</button><button class="icon-btn" onclick="deleteBook('${esc(b.id)}')">Delete</button></div></div>`}).join('')}
  document.getElementById('pagination').innerHTML=arr.length>PAGE_SIZE?`<button class="icon-btn" onclick="bookPage=Math.max(1,bookPage-1);renderBooks()" ${bookPage===1?'disabled':''}>Previous</button><span>Page ${bookPage} of ${pages} · ${arr.length} books</span><button class="icon-btn" onclick="bookPage=Math.min(${pages},bookPage+1);renderBooks()" ${bookPage===pages?'disabled':''}>Next</button>`:`<span>${arr.length} books</span>`}

function scheduleSave(){database.updatedAt=Date.now();setSaveState('Unsaved changes');clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,650)}
async function saveNow(){if(saveInFlight){saveAgain=true;return}saveInFlight=true;setSaveState('Saving…');try{await driveWrite(BOOKS_FILE,database);setSaveState('Saved','ok')}catch(e){console.error(e);setSaveState('Save failed','err');setStatus('Save failed: '+e.message,'err')}finally{saveInFlight=false;if(saveAgain){saveAgain=false;saveNow()}}}
async function saveRules(){try{await driveWrite(RULES_FILE,rules);setStatus('Genres updated.','ok')}catch(e){setStatus('Could not save genres: '+e.message,'err')}}

function renderRules(){buildGenreControls()}
function addCustomGenre(){const el=document.getElementById('new-genre');const value=el.value.trim();if(!value)return;if(!rules.customGenres.includes(value))rules.customGenres.push(value);el.value='';renderRules();saveRules()}

function createManualBook(data={}){const b=normaliseBook({id:uid('book'),title:data.title||'New book',author:data.author||'',cover:data.cover||'',publisher:data.publisher||'',pages:data.pages||0,series:data.series||'',seriesNumber:data.seriesNumber||'',currentPage:0,rating10:null,shelf:'read',status:'finished',readings:[{id:uid('reading'),date:todayIso(),precision:'day'}],genres:[],tags:[],createdAt:Date.now(),updatedAt:Date.now(),...data});database.books.unshift(b);refreshAll();scheduleSave();openEditor(b.id)}

function toggleScanner(){const container=document.getElementById('reader-container');if(container.style.display==='block'){stopScanner();return}container.style.display='block';html5QrCode=new Html5Qrcode('reader');html5QrCode.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},async(decodedText)=>{stopScanner();setStatus(`Scanned ISBN: ${decodedText}. Fetching book metadata…`,'ok');try{const res=await serverAction('lookupIsbn',{isbn:decodedText});createManualBook(res.book);setStatus('Book imported successfully from barcode!','ok')}catch(e){setStatus('Barcode book lookup failed: '+e.message,'err')}},(errorMessage)=>{/* scanning error */}).catch(err=>{setStatus('Camera start failed: '+err,'err')})}
function stopScanner(){if(html5QrCode){html5QrCode.stop().then(()=>{html5QrCode.clear()}).catch(e=>console.log(e));html5QrCode=null}document.getElementById('reader-container').style.display='none'}

async function quickOnlineSearch(){const query=document.getElementById('quick-query').value.trim();if(!query)return;const container=document.getElementById('quick-results');container.innerHTML='<div class="empty" style="padding:1rem">Searching online…</div>';try{const res=await serverAction('searchBook',{query});const books=res.books||[];if(!books.length){container.innerHTML='<div class="empty" style="padding:1rem">No books found.</div>';return}container.innerHTML=`<div class="search-modal-results">${books.map(b=>`<div class="search-result-item" onclick='createManualBook(${JSON.stringify(b).replace(/'/g,"&#39;")});document.getElementById("quick-results").innerHTML="";document.getElementById("quick-query").value=""'>${b.cover?`<img src="${esc(b.cover)}" alt="">`:'<div style="width:36px;height:54px;background:var(--border)"></div>'}<div><div style="font-weight:700;font-size:0.82rem">${esc(b.title)}</div><div style="font-size:0.72rem;color:var(--muted)">${esc(b.author\vert{}\vert{}'Unknown author')}${b.series?' · '+b.series:''}</div></div></div>`).join('')}</div>`}catch(e){container.innerHTML='<div class="empty" style="padding:1rem">Search failed: '+e.message+'</div>'}}

function openEditor(id){const b=database.books.find(x=>x.id===id);if(!b)return;editingBookId=id;document.getElementById('editor-heading').textContent=b.title||'Edit book';document.getElementById('editor-form').innerHTML=editorHtml(b);document.getElementById('editor-overlay').classList.add('on')}
function closeEditor(e){if(e&&e.target!==document.getElementById('editor-overlay'))return;document.getElementById('editor-overlay').classList.remove('on');editingBookId=null;refreshAll()}
function editorHtml(b){const genres=allGenres();const rating=b.rating10===null||b.rating10===undefined?'':b.rating10;return`<div class="form-grid"><div class="field"><label>Title</label><input id="ed-title" value="${esc(b.title)}" oninput="editorChanged()"></div><div class="field"><label>Author</label><input id="ed-author" value="${esc(b.author)}" oninput="editorChanged()"></div><div class="field"><label>Series Name</label><input id="ed-series" value="${esc(b.series||'')}" oninput="editorChanged()" placeholder="e.g. Harry Potter"></div><div class="field"><label>Book # in Series</label><input id="ed-seriesnum" value="${esc(b.seriesNumber||'')}" oninput="editorChanged()" placeholder="e.g. 1 or 3.5"></div><div class="field"><label>Shelf</label><select id="ed-shelf" onchange="editorChanged()"><option value="read" ${b.shelf==='read'?'selected':''}>Read</option><option value="towatch" ${b.shelf==='towatch'?'selected':''}>To Read</option></select></div><div class="field"><label>Rating out of 10</label><input id="ed-rating" type="number" min="0" max="10" step="0.5" value="${rating}" oninput="editorChanged()"></div><div class="field wide"><label>Cover URL</label><input id="ed-cover" value="${esc(b.cover||'')}" oninput="editorChanged()"></div><div class="field"><label>Publisher</label><input id="ed-publisher" value="${esc(b.publisher||'')}" oninput="editorChanged()"></div><div class="field"><label>Current Page</label><input id="ed-currpage" type="number" min="0" value="${Number(b.currentPage)||0}" oninput="editorChanged()"></div><div class="field"><label>Total Pages</label><input id="ed-pages" type="number" min="0" value="${Number(b.pages)||''}" oninput="editorChanged()"></div><div class="field wide"><label>Genres &amp; Custom Folders</label><div class="genre-options">${genres.map(g=>`<label class="genre-option"><input type="checkbox" value="${esc(g)}" ${(b.genres\vert{}\vert{}[]).includes(g)?'checked':''} onchange="editorChanged()">${esc(g)}</label>`).join('')}</div></div><div class="field wide"><label>Tags, comma separated</label><input id="ed-tags" value="${esc((b.tags||[]).join(', '))}" oninput="editorChanged()"></div><div class="field wide"><label>My review</label><textarea id="ed-review" oninput="editorChanged()">${esc(b.review||'')}</textarea></div><div class="field wide"><label>Description</label><textarea id="ed-description" oninput="editorChanged()">${esc(b.description||'')}</textarea></div><div class="field wide"><label>Reading history</label><div id="reading-editor">${readingRowsHtml(b)}</div><button class="btn sm secondary" onclick="addReading()">Add reading</button></div><div class="wide actions"><button class="btn red" onclick="deleteBook('${esc(b.id)}');closeEditor()">Delete book</button><button class="btn secondary" onclick="closeEditor()">Done</button></div></div>`}
function readingRowsHtml(b){return(b.readings||[]).map((r,i)=>`<div class="reading-row"><select onchange="changeReading(${i},'precision',this.value)"><option value="day" ${r.precision==='day'?'selected':''}>Exact date</option><option value="month" ${r.precision==='month'?'selected':''}>Month and year</option><option value="unknown" ${r.precision==='unknown'?'selected':''}>Date unknown</option></select>${r.precision==='unknown'?'<span class="note">No date stored</span>':`<input type="${r.precision==='month'?'month':'date'}" value="${esc(r.date\vert{}\vert{}'')}" onchange="changeReading(${i},'date',this.value)">`}<button class="icon-btn" onclick="removeReading(${i})">Remove</button></div>`).join('')||'<div class="note">No reading history recorded.</div>'}
function editorChanged(){const b=database.books.find(x=>x.id===editingBookId);if(!b)return;b.title=document.getElementById('ed-title').value.trim();b.author=document.getElementById('ed-author').value.trim();b.series=document.getElementById('ed-series').value.trim();b.seriesNumber=document.getElementById('ed-seriesnum').value.trim();b.shelf=document.getElementById('ed-shelf').value;b.status=b.shelf==='towatch'?'towatch':'finished';b.cover=document.getElementById('ed-cover').value.trim();b.publisher=document.getElementById('ed-publisher').value.trim();b.currentPage=Number(document.getElementById('ed-currpage').value)||0;b.pages=Number(document.getElementById('ed-pages').value)||0;b.description=document.getElementById('ed-description').value.trim();const v=document.getElementById('ed-rating').value;b.rating10=v===''?null:Math.max(0,Math.min(10,Number(v)));b.review=document.getElementById('ed-review').value;b.genres=[...document.querySelectorAll('.genre-options input:checked')].map(x=>x.value);b.tags=splitList(document.getElementById('ed-tags').value);b.updatedAt=Date.now();document.getElementById('editor-heading').textContent=b.title||'Edit book';renderStats();scheduleSave()}
function addReading(){const b=database.books.find(x=>x.id===editingBookId);if(!b)return;b.readings.push({id:uid('reading'),date:todayIso(),precision:'day'});document.getElementById('reading-editor').innerHTML=readingRowsHtml(b);scheduleSave()}
function changeReading(i,key,value){const b=database.books.find(x=>x.id===editingBookId);if(!b||!b.readings[i])return;b.readings[i][key]=value;if(key==='precision'){if(value==='unknown')b.readings[i].date='';else if(value==='month'&&/^\d{4}-\d{2}$/.test(b.readings[i].date\vert{}\vert{}''))b.readings[i].date=b.readings[i].date.slice(0,7);else if(value==='day'&&!/^\d{4}-\d{2}-\d{2}$/.test(b.readings[i].date||''))b.readings[i].date=todayIso();document.getElementById('reading-editor').innerHTML=readingRowsHtml(b)}scheduleSave()}
function removeReading(i){const b=database.books.find(x=>x.id===editingBookId);if(!b)return;b.readings.splice(i,1);document.getElementById('reading-editor').innerHTML=readingRowsHtml(b);scheduleSave()}
function splitList(v){return [...new Set(String(v||'').split(',').map(x=>x.trim()).filter(Boolean))]}
function deleteBook(id){const b=database.books.find(x=>x.id===id);if(!b||!confirm(`Delete “${b.title}” from books.json?`))return;database.books=database.books.filter(x=>x.id!==id);refreshAll();scheduleSave()}

loadAll();
</script>
</body>
</html>
